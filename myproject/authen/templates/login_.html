{% extends 'main.html' %}
{% load static %}

{% block head %}
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
{% endblock %}

{% block content %}
    <main class="login-page">
        <section class="login-card">
            <header class="login-header">
                <p>Welcome back</p>
                <h1>Sign in</h1>
                <span>Log in to continue to your account.</span>
            </header>

            {% if messages %}
                <div class="login-messages" role="status">
                    {% for i in messages %}
                        <p>{{ i }}</p>
                    {% endfor %}
                </div>
            {% endif %}

            <form class="login-form" action="" method="POST">
            {% csrf_token %}
                <div class="login-field">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" placeholder="Enter your username" name="username" autocomplete="username" required>
                </div>
                <div class="login-field">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Enter your password" name="password" autocomplete="current-password" required>
                </div>
                <button class="login-submit" type="submit">Log in</button>
                <div class="login-links">
                    <a href="{% url 'forgot_password' %}">Forgot password?</a>
                    <a href="{% url 'register' %}">Create an account</a>
                </div>
            </form>
        </section>
    </main>
{% endblock %}
