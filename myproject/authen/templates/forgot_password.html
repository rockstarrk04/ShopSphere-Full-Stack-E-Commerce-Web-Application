{% extends 'main.html' %}

{% block content %}
    <center>
        {% if new %}
            <form action="" method="POST">
                {% csrf_token %}
                <label for="">Enter New Password:</label>
                <input type="password" placeholder="enter new password" name="password"> <br><br>
                <label for="">Confirm Password:</label>
                <input type="password" placeholder="confirm password" name="cpassword"> <br><br>
                <button type="submit">Reset Password</button>
            </form>
        {% else %}
            <form action="" method="POST">
                {% csrf_token %}
                <label for="">UserName:</label>
                <input type="text" placeholder="enter username" name="username"> <br><br>
                <button type="submit">Continue</button>
            </form>
        {% endif %}
    </center>
{% endblock %}
