{% extends 'main.html' %}
{% load static %}

{% block head %}
    <link rel="stylesheet" href="{% static 'css/register.css' %}">
{% endblock %}

{% block content %}
    <main class="register-page">
        <section class="register-card">
            <header class="register-header">
                <p>Join ShopSphere</p>
                <h1>Create your account</h1>
                <span>Enter your details to get started.</span>
            </header>

            <form class="register-form" action="" method="POST">
            {% csrf_token %}
                <div class="register-fields">
                    <div class="register-field">
                        <label for="register-first-name">First name</label>
                        <input type="text" id="register-first-name" placeholder="Enter your first name" name="fname" autocomplete="given-name">
                    </div>
                    <div class="register-field">
                        <label for="register-last-name">Last name</label>
                        <input type="text" id="register-last-name" placeholder="Enter your last name" name="lname" autocomplete="family-name">
                    </div>
                    <div class="register-field register-field-wide">
                        <label for="register-email">Email</label>
                        <input type="email" id="register-email" placeholder="Enter your email" name="email" autocomplete="email" required>
                    </div>
                    <div class="register-field register-field-wide">
                        <label for="register-username">Username</label>
                        <input type="text" id="register-username" placeholder="Choose a username" name="uname" autocomplete="username">
                    </div>
                    <div class="register-field">
                        <label for="register-password">Password</label>
                        <input type="password" id="register-password" placeholder="Create a password" name="upass" autocomplete="new-password">
                    </div>
                    <div class="register-field">
                        <label for="register-confirm-password">Confirm password</label>
                        <input type="password" id="register-confirm-password" placeholder="Confirm your password" name="cpass" autocomplete="new-password">
                    </div>
                </div>
                <button class="register-submit" type="submit">Create account</button>
                <p class="register-login-link">Already have an account? <a href="{% url 'login_' %}">Sign in</a></p>
            </form>
        </section>
    </main>
{% endblock %}
